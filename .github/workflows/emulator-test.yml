name: Emulator launch test

on:
  push:
    branches: [debug-crash]

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Temporary signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/t.jks" -storepass tmpkey123 -keypass tmpkey123 \
            -alias purify -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Purify"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/t.jks"
            echo "KEYSTORE_PASSWORD=tmpkey123"
            echo "KEY_ALIAS=purify"
            echo "KEY_PASSWORD=tmpkey123"
          } >> "$GITHUB_ENV"

      - name: Build release and debug APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: bash scripts/emu-test.sh

      - name: Save logs to the branch
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f debug-logs
          git commit -m "Emulator launch logs" || exit 0
          git push
